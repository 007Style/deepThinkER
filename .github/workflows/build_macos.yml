name: Build macOS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true          # pull Git LFS objects (Metal shader .metallib files)

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS desktop target
        run: flutter config --enable-macos-desktop

      - name: Install CocoaPods dependencies
        run: cd macos && pod install && cd ..

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          # Flutter names the bundle after pubspec.yaml `name:` → deep_think_er.app
          APP_PATH="build/macos/Build/Products/Release/deep_think_er.app"
          VERSION="${GITHUB_REF_NAME:-1.0.0}"
          VERSION="${VERSION#v}"   # strip leading 'v'
          create-dmg \
            --volname "deepThinkER" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 128 \
            --icon "deep_think_er.app" 160 185 \
            --hide-extension "deep_think_er.app" \
            --app-drop-link 430 185 \
            "build/deepThinkER-v${VERSION}-macos.dmg" \
            "${APP_PATH}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepThinkER-macos-dmg
          path: build/deepThinkER-v*-macos.dmg
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/deepThinkER-v*-macos.dmg
          body: |
            ## deepThinkER ${{ github.ref_name }}

            ### macOS
            Download `deepThinkER-${{ github.ref_name }}-macos.dmg`, open it, and drag **deepThinkER.app** to your Applications folder.

            **Requirements:** macOS 13 Ventura or later · Apple Silicon (M1/M2/M3/M4) recommended · 32 GB RAM minimum for the full model stack.

            ### Windows
            A pre-compiled Windows installer is not yet available.
            Windows users can compile from source — see [windows/BUILD.md](https://github.com/007Style/deepThinkER/blob/main/windows/BUILD.md).

            ### AI Models (~22 GB total, downloaded on first launch)

            | Model | Tag | ~RAM |
            |-------|-----|------|
            | Mistral 7B | `mistral:7b` | ~4.1 GB |
            | Llama 3 8B | `llama3:8b` | ~4.7 GB |
            | Gemma 2 9B | `gemma2:9b` | ~5.5 GB |
            | Phi-3 14B | `phi3:14b` | ~8.2 GB |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
